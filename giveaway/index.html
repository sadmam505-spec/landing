<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>MrBeast $100 Giveaway</title>

				<script async="" src="https://www.googletagmanager.com/gtag/js?id=YOUR_MEASUREMENT_ID"></script>
				<script>
					window.dataLayer = window.dataLayer || [];
					function gtag(){dataLayer.push(arguments);}
					gtag('js', new Date());
					gtag('config', 'YOUR_MEASUREMENT_ID');
				</script>

				<style>
					body { font-family: 'Arial', sans-serif; background: #000; color: #fff; text-align: center; margin: 0; padding: 0; }
					.container { max-width: 600px; margin: auto; padding: 20px; }

					h1 { color: #ff0000; text-transform: uppercase; font-size: 2.5rem; animation: pulse 2s infinite; margin-bottom: 5px; }

					/* এনার্জেটিক এবং গ্লোয়িং উইনিং মেসেজ */
					.winning-line {
					background: linear-gradient(45deg, #00b09b, #96c93d);
					color: #fff;
					font-weight: bold;
					font-size: 1.4rem;
					padding: 20px;
					border-radius: 15px;
					margin: 20px auto;
					display: inline-block;
					box-shadow: 0 0 20px rgba(0, 255, 127, 0.6);
					animation: glowing 1s infinite alternate;
					border: 2px solid #fff;
					}

					@keyframes glowing {
					from { box-shadow: 0 0 10px #00ff00; transform: scale(1); }
					to { box-shadow: 0 0 25px #00ff00, 0 0 35px #00ff00; transform: scale(1.03); }
					}

					.gift-img { width: 100%; border-radius: 15px; margin: 20px 0; border: 3px solid #ffcc00; }

					.btn {
					display: block; background: #ffcc00; color: #000; padding: 20px;
					font-size: 1.5rem; font-weight: bold; text-decoration: none;
					border-radius: 50px; margin: 30px 0; transition: transform 0.3s;
					box-shadow: 0 0 20px #ffcc00; cursor: pointer;
					}
					.btn:hover { transform: scale(1.05); }

					.counter { background: #333; padding: 15px; border-radius: 10px; font-size: 1.2rem; margin-top: 20px; }
					@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
				</style>
			</head>
	<body>

		<div class="container">
			<h1>Mr Beast Giveaway!</h1>

			<div class="winning-line">
				Congratulations! You have been selected to receive $100!
			</div>

			<img src="mr.jpg" class="gift-img" alt="Giveaway">

				<p>Wthdraw your funds instantly to your preferred wallet.</p>

				<a href="YOUR_LOCKER_OR_SMARTLINK_URL_HERE" class="btn">WITHDRAW YOUR $100 NOW</a>

				<div class="counter">
					Last 1 hour withdraws: <b id="count">3,482</b> people
				</div>
			</div>

		<script>
			let count = 3482;
			setInterval(() => {
			count += Math.floor(Math.random() * 5);
			document.getElementById('count').innerText = count.toLocaleString();
			}, 2000);
		</script>

	</body>
</html>
